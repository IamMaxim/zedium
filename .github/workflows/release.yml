name: release

# Triggered by fork-revision tags like v1.4.2-1.
# Builds the `zedium` binary for each target, packages a plain archive, and
# publishes a GitHub Release. No auto-update channel — users replace the archive.
on:
  push:
    tags:
      - "v*-*"
  # Manual trigger to validate the build matrix without minting a public
  # release tag. On a non-tag ref the `publish` job is skipped (see its `if`),
  # so dispatch runs build+upload-artifact only.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-compiled `remote_server` daemons bundled into every editor build so
  # SSH/Docker/WSL remoting works with NO network download (the editor resolves
  # them at connect time from `<exe_dir>/remote_servers/`). Linux targets are
  # static musl cross-builds via zig (portable across host glibc versions);
  # macos-aarch64 builds natively. See tools/build-remote-servers.sh and
  # docs/REMOTE_SERVERS.md.
  remote_servers:
    name: remote_server (${{ matrix.host }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runs-on: ubuntu-latest
            targets: linux-x86_64 linux-aarch64
          - host: macos
            runs-on: macos-14
            targets: macos-aarch64
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space (Linux)
        if: matrix.host == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch submodule tags + set git identity
        run: |
          git -C zed fetch --tags --force origin || true
          git config --global user.email "ci@zedium.local"
          git config --global user.name "Zedium CI"

      - name: Install just
        run: cargo install --locked just || true

      - name: Apply patches
        run: just apply

      - name: Install zig + cargo-zigbuild (Linux musl cross)
        if: matrix.host == 'linux'
        run: |
          # cargo-zigbuild drives a static musl cross-compile; zig is its C
          # toolchain (and the tool's objcopy for stripping). Pinned, no
          # third-party action, so the build stays self-contained.
          ZIG_VERSION=0.14.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed
          key: remote-${{ matrix.host }}

      - name: Build remote_server artifacts
        run: ./tools/build-remote-servers.sh ${{ matrix.targets }}

      - name: Upload remote_server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remote-servers-${{ matrix.host }}
          path: zed/target/remote-servers-bundle/*.gz

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # Wait for the bundled remote_server daemons so every package can embed them.
    needs: [remote_servers]
    # Some targets are allowed to fail without blocking the release (see
    # macos-arm64 below); continue-on-error keeps `publish` (needs: build)
    # running so the other binaries + the extension bundle still ship.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # Native arm64: the ~160MB binary's __text exceeds arm64's ±128MB B/BL
          # branch range, and the ctor-crate constructors (gpui build_classes,
          # placed in __text_startup at the end of __TEXT) branch >128MB back to
          # cocoa encode helpers near the start of __text. Apple's ld64 — both
          # ld-prime and -ld_classic — REFUSES to insert range-extension thunks
          # for these, so the link fails. LLVM's ld64.lld DOES insert them, so we
          # link arm64 with lld (installed below). This keeps opt-level=3 (no perf
          # regression) and links the full-size binary. Verified by the
          # arm64-link-probe experiment (lld linked the same 160MB __text that
          # ld64 rejected). NOT experimental anymore — arm64 is a blocking target.
          - target: macos-arm64
            runs-on: macos-14
            rust-target: aarch64-apple-darwin
            archive: zip
            use_lld: true
          # Intel Macs are cross-compiled from the Apple-Silicon runner: the
          # macos-13 (Intel) image is retired, and the macOS SDK is universal so
          # `--target x86_64-apple-darwin` links a working x86_64 binary.
          - target: macos-x86_64
            runs-on: macos-14
            rust-target: x86_64-apple-darwin
            archive: zip
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          # Zed's release target/ is tens of GB; reclaim the preinstalled
          # toolchains the runner ships so the build does not run out of disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch submodule tags + set git identity
        run: |
          # `just apply` resolves the baseline via `git describe --tags` and
          # replays the series with `git am`; a clean runner has neither the
          # submodule tags nor a committer identity, so both fail without this.
          git -C zed fetch --tags --force origin || true
          git config --global user.email "ci@zedium.local"
          git config --global user.name "Zedium CI"

      - name: Install just
        run: cargo install --locked just || true

      - name: Install Linux system deps
        if: startsWith(matrix.target, 'linux')
        run: |
          if [ -x zed/script/linux ]; then
            zed/script/linux
          else
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libssl-dev libasound2-dev \
              libfontconfig-dev libwayland-dev libxkbcommon-dev libvulkan-dev \
              libgit2-dev make clang cmake mold
          fi

      - name: Apply patches
        run: just apply

      - name: Verify (static gate)
        run: just verify

      - name: Add Rust target
        # Run inside zed/ so the rust-toolchain.toml override (1.95.0) applies:
        # the cross-target must be added to the toolchain cargo actually uses,
        # not the runner's default, or the build fails with "can't find crate
        # for `std`".
        run: cd zed && rustup target add ${{ matrix.rust-target }}

      - name: Install lld (macOS arm64 link-island workaround)
        # ld64.lld inserts the ARM64 range-extension thunks Apple's ld64 won't,
        # which the ~160MB arm64 __text needs to link. See the macos-arm64
        # matrix comment.
        if: matrix.use_lld
        run: brew install lld

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed
          key: ${{ matrix.target }}

      - name: Build release binary
        # RELEASE_CHANNEL=stable makes build.rs embed the stable (teal) app icon
        # and selects the dev.zedium.Zedium identity; without it the build
        # defaults to the dev channel (amber icon, -Dev id).
        env:
          RELEASE_CHANNEL: stable
        run: |
          cd zed
          # If a target needs extra rustflags (e.g. macos-arm64's lld linker),
          # replicate the repo's .cargo/config.toml [build] rustflags and append
          # them, since setting RUSTFLAGS via env fully overrides the config
          # value (cargo does not merge the two).
          extra='${{ matrix.extra_rustflags }}'
          if [ "${{ matrix.use_lld }}" = "true" ]; then
            # Resolve the brewed ld64.lld path at build time and route cc to it.
            extra="-C link-arg=-fuse-ld=$(brew --prefix lld)/bin/ld64.lld"
          fi
          if [ -n "$extra" ]; then
            export RUSTFLAGS="-C symbol-mangling-version=v0 --cfg tokio_unstable $extra"
          fi
          cargo build --release --target ${{ matrix.rust-target }} --package zed --bin zedium

      - name: Download bundled remote_server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remote-servers-*
          merge-multiple: true
          path: remote-bundle

      - name: Build macOS .app bundle
        if: startsWith(matrix.target, 'macos')
        env:
          RELEASE_CHANNEL: stable
        run: |
          set -euo pipefail
          cd zed
          # Install the zed fork of cargo-bundle, which generates the .app
          # skeleton (Info.plist, icons, url schemes) from crates/zed/Cargo.toml's
          # [package.metadata.bundle-stable]. Version-pinned like script/bundle-mac.
          want="cargo-bundle v0.6.1-zed"
          have="$(cargo -q bundle --help 2>&1 | head -n1 || true)"
          if [ "$have" != "$want" ]; then
            cargo install cargo-bundle \
              --git https://github.com/zed-industries/cargo-bundle.git --branch zed-deploy
          fi
          export ZED_BUNDLE=true ZED_RELEASE_CHANNEL=stable CXXFLAGS="-stdlib=libc++"
          # Two in-place Cargo.toml edits for the bundle run (restored right after):
          # 1. cargo-bundle reads [package.metadata.bundle]; our channels live under
          #    bundle-stable, so rename it.
          # 2. cargo-bundle's default (Main) artifact picks the FIRST `bin` target
          #    by cargo-metadata order (alphabetical). The fork's rename to `zedium`
          #    made `zed_visual_test_runner` sort before it, so bundle grabbed that
          #    (gated, never-built) bin and failed to copy it. Drop that [[bin]]
          #    block so `zedium` is the only — and selected — binary. (Passing
          #    --bin instead would discard the top-level icon/identifier metadata.)
          pushd crates/zed >/dev/null
          cp Cargo.toml Cargo.toml.bak
          sed -i.sed 's/package.metadata.bundle-stable/package.metadata.bundle/' Cargo.toml
          perl -0pi -e 's/\n\[\[bin\]\]\nname = "zed_visual_test_runner".*?required-features = \["visual-tests"\]\n//s' Cargo.toml
          # CARGO_BUNDLE_SKIP_BUILD reuses the binary built above (with the arm64
          # lld link fix) instead of recompiling — cargo-bundle just packages
          # target/<triple>/release/zedium. The output path is workspace-relative.
          app_path="$(CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle --release \
            --target ${{ matrix.rust-target }} --select-workspace-root | xargs)"
          mv Cargo.toml.bak Cargo.toml; rm -f Cargo.toml.sed
          popd >/dev/null
          echo "bundled: $app_path"
          # Finder document icon (DocumentTypes.plist references Document.icns).
          cp crates/zed/resources/Document.icns "$app_path/Contents/Resources/Document.icns" || true
          # Embed the pre-compiled remote_server daemons so SSH/Docker/WSL remoting
          # works offline (resolved from Contents/MacOS/remote_servers/ at connect).
          mkdir -p "$app_path/Contents/MacOS/remote_servers"
          if compgen -G "$GITHUB_WORKSPACE/remote-bundle/"*.gz >/dev/null; then
            cp "$GITHUB_WORKSPACE"/remote-bundle/*.gz "$app_path/Contents/MacOS/remote_servers/"
          else
            echo "::warning::no remote_server artifacts to embed in the .app"
          fi
          # Ad-hoc sign (no Apple cert): drop the associated-domains entitlement
          # (needs a real team) like script/bundle-mac's no-cert path, then deep-sign
          # so Gatekeeper runs the app after the user clears quarantine.
          sed '/com.apple.developer.associated-domains/,+1d' \
            crates/zed/resources/zed.entitlements > "$app_path/Contents/Resources/zed.entitlements"
          codesign --force --deep \
            --entitlements "$app_path/Contents/Resources/zed.entitlements" \
            --sign - "$app_path" -v
          # cargo-bundle --select-workspace-root prints an ABSOLUTE path.
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="zedium-${tag}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # macOS: ship Zedium.app. ditto preserves the bundle structure and
            # the ad-hoc code signature (a plain `zip` can corrupt the signature).
            asset="${stage}.zip"
            ditto -c -k --keepParent "$APP_PATH" "$asset"
            echo "asset=$asset" >> "$GITHUB_OUTPUT"
          else
            # Linux: bare binary + assets, with the remote_server daemons next to
            # the binary (editor resolves <exe_dir>/remote_servers/ at connect).
            mkdir -p "$stage/bin/remote_servers"
            cp "zed/target/${{ matrix.rust-target }}/release/zedium" "$stage/bin/zedium"
            cp -r zed/assets "$stage/assets" || true
            cp docs/INSTALL.md docs/EDIT_PREDICTION.md "$stage/" || true
            cp zed/LICENSE-GPL zed/LICENSE-AGPL zed/LICENSE-APACHE "$stage/" 2>/dev/null || true
            if compgen -G "$GITHUB_WORKSPACE/remote-bundle/"*.gz >/dev/null; then
              cp "$GITHUB_WORKSPACE"/remote-bundle/*.gz "$stage/bin/remote_servers/"
            fi
            tar czf "${stage}.tar.gz" "$stage"
            echo "asset=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksum
        shell: bash
        run: |
          asset="${{ steps.package.outputs.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

  snapshot_extensions:
    name: snapshot extension bundle
    # Build-time only: snapshots the public Zed extension registry into an
    # offline-installable bundle. Never runs in the shipped binary. Independent
    # of the build matrix, so it runs in parallel.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodule needed)
        uses: actions/checkout@v4

      - name: Build offline extension bundle
        run: |
          # Derive the upstream Zed version from the tag (v1.5.4-1 -> v1.5.4) so
          # the bundle is labelled with the Zed release it is compatible with.
          ref="${GITHUB_REF_NAME:-dev}"
          zed_version="${ref%-*}"
          bash tools/snapshot-extensions.sh \
            --out dist-extensions \
            --channel stable \
            --zed-version "$zed_version"

      - name: Upload extension bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: extensions-bundle
          path: |
            dist-extensions/*.tar.gz
            dist-extensions/*.tar.gz.sha256

  publish:
    name: publish release
    needs: [build, snapshot_extensions]
    # Only publish a GitHub Release for real release tags. workflow_dispatch
    # runs (CI validation on a branch) build+upload artifacts but skip this.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Zedium ${{ github.ref_name }} — telemetry-free, cloud-free fork of Zed.

            Install: see `INSTALL.md` in the archive (macOS users must clear the
            quarantine attribute — the build is ad-hoc signed only).

            No auto-update: replace the archive to upgrade. AI features are off
            until you configure a self-hosted/BYO provider.

            Offline extensions: `zedium-extensions-stable-*.tar.gz` is a snapshot
            of the Zed extension registry for air-gapped installs. Carry it to the
            target machine and install via "Install from File" in the Extensions
            view (or the `zed: install prebuilt extension` command). See
            `EXTENSIONS_OFFLINE.md`.
