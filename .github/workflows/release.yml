name: release

# Triggered by fork-revision tags like v1.4.2-1.
# Builds the `zedium` binary for each target, packages a plain archive, and
# publishes a GitHub Release. No auto-update channel — users replace the archive.
on:
  push:
    tags:
      - "v*-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: macos-arm64
            runs-on: macos-14
            rust-target: aarch64-apple-darwin
            archive: zip
          # Intel Macs are cross-compiled from the Apple-Silicon runner: the
          # macos-13 (Intel) image is retired, and the macOS SDK is universal so
          # `--target x86_64-apple-darwin` links a working x86_64 binary.
          - target: macos-x86_64
            runs-on: macos-14
            rust-target: x86_64-apple-darwin
            archive: zip
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          # Zed's release target/ is tens of GB; reclaim the preinstalled
          # toolchains the runner ships so the build does not run out of disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Fetch submodule tags + set git identity
        run: |
          # `just apply` resolves the baseline via `git describe --tags` and
          # replays the series with `git am`; a clean runner has neither the
          # submodule tags nor a committer identity, so both fail without this.
          git -C zed fetch --tags --force origin || true
          git config --global user.email "ci@zedium.local"
          git config --global user.name "Zedium CI"

      - name: Install just
        run: cargo install --locked just || true

      - name: Install Linux system deps
        if: startsWith(matrix.target, 'linux')
        run: |
          if [ -x zed/script/linux ]; then
            zed/script/linux
          else
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libssl-dev libasound2-dev \
              libfontconfig-dev libwayland-dev libxkbcommon-dev libvulkan-dev \
              libgit2-dev make clang cmake mold
          fi

      - name: Apply patches
        run: just apply

      - name: Verify (static gate)
        run: just verify

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed
          key: ${{ matrix.target }}

      - name: Build release binary
        # RELEASE_CHANNEL=stable makes build.rs embed the stable (teal) app icon
        # and selects the dev.zedium.Zedium identity; without it the build
        # defaults to the dev channel (amber icon, -Dev id).
        env:
          RELEASE_CHANNEL: stable
        run: cd zed && cargo build --release --target ${{ matrix.rust-target }} --package zed --bin zedium

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="zedium-${tag}-${{ matrix.target }}"
          mkdir -p "$stage/bin"
          cp "zed/target/${{ matrix.rust-target }}/release/zedium" "$stage/bin/zedium"
          cp -r zed/assets "$stage/assets" || true
          cp docs/INSTALL.md docs/EDIT_PREDICTION.md "$stage/" || true
          cp zed/LICENSE-GPL zed/LICENSE-AGPL zed/LICENSE-APACHE "$stage/" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # Ad-hoc sign the bare binary so Gatekeeper can run it after
            # the user clears the quarantine attribute (see INSTALL.md).
            codesign --force --sign - "$stage/bin/zedium" || true
            zip -r "${stage}.zip" "$stage"
            echo "asset=${stage}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${stage}.tar.gz" "$stage"
            echo "asset=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksum
        shell: bash
        run: |
          asset="${{ steps.package.outputs.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Zedium ${{ github.ref_name }} — telemetry-free, cloud-free fork of Zed.

            Install: see `INSTALL.md` in the archive (macOS users must clear the
            quarantine attribute — the build is ad-hoc signed only).

            No auto-update: replace the archive to upgrade. AI features are off
            until you configure a self-hosted/BYO provider.
